name: Deploy to GCP

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Set these in GitHub: Settings → Secrets and variables → Actions → Variables
  # Required variables:
  #   GCP_PROJECT_ID           - GCP project ID
  #   GCP_PROJECT_NUMBER       - GCP project number
  #   GH_REPO_OWNER_ID         - Numeric GitHub owner ID (gh api users/OWNER --jq .id)
  #
  # After bootstrap, add these variables:
  #   GCP_WORKLOAD_IDENTITY_PROVIDER - Full WIF provider path (from terraform output)
  #   GCP_CICD_SERVICE_ACCOUNT       - Service account email (from terraform output)
  #
  # Bootstrap only (delete after first successful deploy):
  #   GCP_BOOTSTRAP_CREDENTIALS (secret) - Service account key JSON
  #
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  PROJECT_NUMBER: ${{ vars.GCP_PROJECT_NUMBER }}
  WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  CICD_SERVICE_ACCOUNT: ${{ vars.GCP_CICD_SERVICE_ACCOUNT }}
  REGION: us-central1
  WEBHOOK_SERVICE: x-unfurls-webhook
  WORKER_SERVICE: x-unfurls-worker

jobs:
  # ==========================================================================
  # Build and Test
  # ==========================================================================
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run quality checks
        run: |
          uv run ruff format --check src/ tests/
          uv run ruff check src/ tests/
          uv run mypy src/
          uv run pytest tests/ -q

  # ==========================================================================
  # Build and Push Docker Images (only on main branch)
  # ==========================================================================
  build-images:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    # Required for Workload Identity Federation
    permissions:
      contents: read
      id-token: write

    outputs:
      webhook_image: ${{ steps.set-outputs.outputs.webhook_image }}
      worker_image: ${{ steps.set-outputs.outputs.worker_image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Try WIF first, fall back to bootstrap credentials
      - name: Authenticate to Google Cloud (Workload Identity)
        if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        id: auth-wif
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.CICD_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Authenticate to Google Cloud (Bootstrap)
        if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER == ''
        id: auth-bootstrap
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_BOOTSTRAP_CREDENTIALS }}
          token_format: access_token

      - name: Set auth output
        id: auth
        run: |
          if [ -n "${{ steps.auth-wif.outputs.access_token }}" ]; then
            echo "access_token=${{ steps.auth-wif.outputs.access_token }}" >> $GITHUB_OUTPUT
          else
            echo "access_token=${{ steps.auth-bootstrap.outputs.access_token }}" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and push webhook image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.webhook
          push: true
          tags: |
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/x-unfurls/webhook:${{ github.sha }}
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/x-unfurls/webhook:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.worker
          push: true
          tags: |
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/x-unfurls/worker:${{ github.sha }}
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/x-unfurls/worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set image outputs
        id: set-outputs
        run: |
          echo "webhook_image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/x-unfurls/webhook:${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "worker_image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/x-unfurls/worker:${{ github.sha }}" >> $GITHUB_OUTPUT

  # ==========================================================================
  # Deploy Infrastructure via Terraform (only on main branch)
  # ==========================================================================
  deploy:
    needs: build-images
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Try WIF first, fall back to bootstrap credentials
      - name: Authenticate to Google Cloud (Workload Identity)
        if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.CICD_SERVICE_ACCOUNT }}

      - name: Authenticate to Google Cloud (Bootstrap)
        if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER == ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_BOOTSTRAP_CREDENTIALS }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

      - name: Terraform Init
        working-directory: infra_gcp/terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ env.PROJECT_ID }}-terraform-state" \
            -backend-config="prefix=x-unfurls"

      - name: Terraform Apply
        working-directory: infra_gcp/terraform
        run: |
          terraform apply -auto-approve \
            -var="project_id=${{ env.PROJECT_ID }}" \
            -var="region=${{ env.REGION }}" \
            -var="github_repo_owner=${{ github.repository_owner }}" \
            -var="github_repo_name=x-unfurls" \
            -var="github_repo_owner_id=${{ vars.GH_REPO_OWNER_ID }}" \
            -var="webhook_image=${{ needs.build-images.outputs.webhook_image }}" \
            -var="worker_image=${{ needs.build-images.outputs.worker_image }}"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify deployment
        run: |
          echo "Webhook URL: $(gcloud run services describe ${{ env.WEBHOOK_SERVICE }} --region=${{ env.REGION }} --format='value(status.url)')"
          echo "Worker URL: $(gcloud run services describe ${{ env.WORKER_SERVICE }} --region=${{ env.REGION }} --format='value(status.url)')"

      - name: Output Terraform values (for bootstrap)
        if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER == ''
        working-directory: infra_gcp/terraform
        run: |
          echo "=============================================="
          echo "BOOTSTRAP COMPLETE - Configure these GitHub Variables:"
          echo "=============================================="
          echo ""
          echo "GCP_WORKLOAD_IDENTITY_PROVIDER:"
          terraform output -raw workload_identity_provider
          echo ""
          echo ""
          echo "GCP_CICD_SERVICE_ACCOUNT:"
          terraform output -raw cicd_service_account_email
          echo ""
          echo ""
          echo "After adding these variables, DELETE the GCP_BOOTSTRAP_CREDENTIALS secret."
          echo "=============================================="
